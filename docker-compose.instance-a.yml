services:
  # Place API Service
  place-api-service:
    image: ${DOCKER_USERNAME:-local}/place-api-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/place-api-service/Dockerfile
    container_name: place-api-service
    restart: unless-stopped
    expose:
      - "${PORT:-4000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-4000}
      - DATABASE_URL=${DATABASE_URL}
      - ELASTICSEARCH_HOSTS=${ELASTICSEARCH_HOSTS:-http://${INSTANCE_B_IP:-elasticsearch-instance-b}:9200}
      - ELASTICSEARCH_USERNAME=${ELASTICSEARCH_APP_USER_NAME:-app_user}
      - ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_APP_USER_PASS}
      - JWT_SECRET=${JWT_SECRET}
      - SECRET_LOGIN_CRYPTO=${SECRET_LOGIN_CRYPTO}
      - API_KEY=${API_KEY:-}
      - BUILD_API_KEY=${BUILD_API_KEY:-}
      - COUPON_SECRET=${COUPON_SECRET}
      - PRODUCT_SECRET=${PRODUCT_SECRET}
    volumes:
      - ./apps/place-api-service/media:/app/media
    networks:
      - instance-a-network
    depends_on:
      zookeeper:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${PORT:-4000}/hello', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # API Gateway
  api-gateway:
    image: ${DOCKER_USERNAME:-local}/api-gateway:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - PLACE_API_SERVICE_URL=${PLACE_API_SERVICE_URL:-http://place-api-service:4000}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
    networks:
      - instance-a-network
    depends_on:
      place-api-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:${CP_VERSION:-7.6.0}
    container_name: zookeeper
    restart: unless-stopped
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    networks:
      - instance-a-network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Kafka
  kafka:
    image: confluentinc/cp-kafka:${CP_VERSION:-7.6.0}
    container_name: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      # 로컬: 외부 접근을 위해 호스트 IP 사용 (Debezium 등 다른 네트워크에서 접근)
      # 프로덕션: INSTANCE_A_IP 사용
      # PLAINTEXT://${KAFKA_ADVERTISED_HOST:-172.17.0.1}:9092 - 외부 접근용 (호스트 IP)
      # PLAINTEXT_INTERNAL://kafka:9093 - 내부 네트워크용
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_ADVERTISED_HOST:-172.17.0.1}:9092,PLAINTEXT_INTERNAL://kafka:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:9093
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT_INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - "9092:9092"
    networks:
      - instance-a-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # KSQLDB
  ksqldb:
    image: confluentinc/cp-ksqldb-server:${CP_VERSION:-7.6.0}
    container_name: ksqldb
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KSQL_CONFIG_DIR=/etc/ksql
      - KSQL_BOOTSTRAP_SERVERS=kafka:9093
      - KSQL_HOST_NAME=ksqldb
      - KSQL_LISTENERS=http://0.0.0.0:8088
      - KSQL_CACHE_MAX_BYTES_BUFFERING=0
      - KSQL_KSQL_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - KSQL_PRODUCER_INTERCEPTOR_CLASSES=io.confluent.monitoring.clients.interceptor.MonitoringProducerInterceptor
      - KSQL_CONSUMER_INTERCEPTOR_CLASSES=io.confluent.monitoring.clients.interceptor.MonitoringConsumerInterceptor
      - KSQL_KSQL_CONNECT_URL=http://connect:8083
      - KSQL_KSQL_LOGGING_PROCESSING_TOPIC_REPLICATION_FACTOR=1
      - KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE=true
      - KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE=true
    ports:
      - "8088:8088"
    networks:
      - instance-a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Schema Registry (KSQLDB dependency)
  schema-registry:
    image: confluentinc/cp-schema-registry:${CP_VERSION:-7.6.0}
    container_name: schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - SCHEMA_REGISTRY_HOST_NAME=schema-registry
      - SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=kafka:9092
      - SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081
    ports:
      - "8081:8081"
    networks:
      - instance-a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Connect (KSQLDB dependency)
  connect:
    image: confluentinc/cp-kafka-connect:${CP_VERSION:-7.6.0}
    container_name: connect
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      - CONNECT_BOOTSTRAP_SERVERS=kafka:9092
      - CONNECT_REST_ADVERTISED_HOST_NAME=connect
      - CONNECT_REST_PORT=8083
      - CONNECT_GROUP_ID=compose-connect-group
      - CONNECT_CONFIG_STORAGE_TOPIC=docker-connect-configs
      - CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_OFFSET_FLUSH_INTERVAL_MS=10000
      - CONNECT_OFFSET_STORAGE_TOPIC=docker-connect-offsets
      - CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_STATUS_STORAGE_TOPIC=docker-connect-status
      - CONNECT_STATUS_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_KEY_CONVERTER=org.apache.kafka.connect.storage.StringConverter
      - CONNECT_VALUE_CONVERTER=io.confluent.connect.avro.AvroConverter
      - CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - CONNECT_PLUGIN_PATH=/usr/share/java,/usr/share/confluent-hub-components
      - CONNECT_LOG4J_LOGGERS=org.apache.zookeeper=ERROR,org.I0Itec.zkclient=ERROR,org.reflections=ERROR
    ports:
      - "8083:8083"
    networks:
      - instance-a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kafka UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_METRICS_PORT=9999
    ports:
      - "${KAFKA_UI_PORT:-9090}:8080"
    networks:
      - instance-a-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nginx 리버스 프록시
  nginx:
    image: ${DOCKER_USERNAME:-local}/mecipe-nginx:latest
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: mecipe-nginx
    restart: unless-stopped
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - APP_PORT=3000
      - SOCKET_PORT=${SOCKET_PORT:-4100}
      - META_VIEWER_SERVICE_URL=${META_VIEWER_SERVICE_URL:-${INSTANCE_B_IP:-meta-viewer-service}:4100}
    ports:
      - "80:80"
      # 포트 443은 SSL 인증서가 있을 때만 노출
      # 로컬 배포: SSL 없이 HTTP만 사용하므로 포트 443 주석 처리
      # 프로덕션: SSL 인증서 설정 후 아래 주석 해제
      # - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
      - ./apps/place-api-service/media:/var/www/media:ro
    networks:
      - instance-a-network
    depends_on:
      api-gateway:
        condition: service_healthy
      place-api-service:
        condition: service_healthy
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  # Certbot (Let's Encrypt SSL 인증서)
  certbot:
    image: certbot/certbot
    container_name: mecipe-certbot
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  instance-a-network:
    driver: bridge

volumes:
  certbot-conf:
    name: mecipe-certbot-conf
  certbot-www:
    name: mecipe-certbot-www

