# Default values for postgres-connection
# This chart manages connection information for external PostgreSQL
# It does NOT deploy PostgreSQL itself

# PostgreSQL Connection Information
connection:
  host: ""  # External PostgreSQL host (IP or FQDN)
  port: "5432"
  username: ""
  password: ""
  database: ""
  
  # Connection URL (if provided, will be used directly)
  url: ""  # Format: postgresql://user:pass@host:port/db?schema=public

# Service for internal reference (optional)
# If PostgreSQL is in Kubernetes but different namespace
service:
  enabled: false
  name: "postgres"
  namespace: "data"
  port: 5432

