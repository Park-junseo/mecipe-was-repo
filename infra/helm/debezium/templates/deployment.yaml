apiVersion: apps/v1
kind: Deployment
metadata:
  name: debezium-connect
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common.selectorLabels" . | nindent 8 }}
    spec:
      {{- include "common.nodeSelector" . }}
      containers:
      - name: debezium-connect
        image: {{ include "common.image" (dict "Values" .Values "repository" .Values.image.repository "tag" .Values.image.tag) }}
        ports:
        - containerPort: 8083
          name: http
        env:
        - name: BOOTSTRAP_SERVERS
          value: {{ .Values.kafka.bootstrapServers | quote }}
        - name: GROUP_ID
          value: {{ .Values.groupId | quote }}
        - name: CONFIG_STORAGE_TOPIC
          value: {{ .Values.configStorageTopic | quote }}
        - name: OFFSET_STORAGE_TOPIC
          value: {{ .Values.offsetStorageTopic | quote }}
        - name: STATUS_STORAGE_TOPIC
          value: {{ .Values.statusStorageTopic | quote }}
        {{- with .Values.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        livenessProbe:
          httpGet:
            path: /connectors
            port: 8083
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /connectors
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 10
---
{{- if .Values.connector }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.fullname" . }}-debezium-connector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
data:
  connector-config.json: |
    {
      "name": {{ .Values.connector.name | quote }},
      "config": {
        "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
        "plugin.name": "pgoutput",
        "tasks.max": "1",
        "database.hostname": {{ .Values.connector.database.hostname | quote }},
        "database.port": {{ .Values.connector.database.port | quote }},
        "database.user": {{ .Values.connector.database.user | quote }},
        "database.password": {{ .Values.connector.database.password | quote }},
        "database.dbname": {{ .Values.connector.database.dbname | quote }},
        "database.server.name": {{ .Values.connector.serverName | quote }},
        "topic.prefix": {{ .Values.connector.serverName | quote }},
        "table.include.list": {{ .Values.connector.tableIncludeList | quote }},
        "publication.autocreate.mode": "all_tables",
        "slot.name": "debezium_slot",
        "heartbeat.interval.ms": "5000",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "false",
        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "key.converter.schemas.enable": "false"
      }
    }
{{- end }}

