# Default values for kafka-ui
global:
  dockerRegistry: ""
  imagePullSecrets: []

name: kafka-ui
namespace: data-streaming

nodeSelector:
  node-role: stream

image:
  repository: provectuslabs/kafka-ui
  tag: latest

kafka:
  brokers: "kafka:9092"

service:
  type: NodePort
  port: 8080  # 내부 포트 (컨테이너 포트)
  nodePort: 30080  # 외부 접속 포트 (8080이 아닌 다른 포트 사용, 30000-32767 범위)

ingress:
  enabled: false
  hosts:
    - host: kafka-ui.localhost
      path: /
  annotations: {}
  # tls:
  #   - secretName: kafka-ui-tls
  #     hosts:
  #       - kafka-ui.localhost

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

