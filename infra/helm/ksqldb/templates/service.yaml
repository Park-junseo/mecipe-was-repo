{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ksqldb.fullname" . }}
  namespace: {{ include "ksqldb.namespace" . }}
  labels:
    {{- include "ksqldb.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port | default 8088 }}
      targetPort: {{ .Values.service.targetPort | default 8088 }}
  selector:
    app.kubernetes.io/name: {{ include "ksqldb.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}