# Default values for place-indexer-service
global:
  dockerRegistry: ""
  imagePullSecrets: []

# Node selector - Instance A (app node)
nodeSelector:
  node-role: app

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP
  port: 3000

env:
  nodeEnv: production
  elasticsearchHosts: "http://elasticsearch:9200"
  elasticsearchUsername: ""
  elasticsearchPassword: ""
  kafkaBrokers: "kafka:9092"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 60
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

# Secrets (should be set via --set or values file)
secrets:
  elasticsearchUsername: ""
  elasticsearchPassword: ""

