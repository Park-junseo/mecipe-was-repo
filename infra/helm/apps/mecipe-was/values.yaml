# Default values for mecipe-was
global:
  dockerRegistry: ""
  imagePullSecrets: []

# Node selector - Instance A (app node)
nodeSelector:
  node-role: app

image:
  repository: ""
  tag: "latest"
  pullPolicy: Always

replicaCount: 1

ingress:
  enabled: true
  host: ""
  tlsSecret: "mecipe-was-tls"

service:
  type: ClusterIP
  ports:
    http: 4000
    socket: 4100

env:
  nodeEnv: production
  port: "4000"
  socketPort: "4100"

postgres:
  username: ""
  password: ""
  database: ""
  hosts: ""

elasticsearch:
  hosts: ""
  username: ""
  password: ""

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /hello
    port: 4000
  initialDelaySeconds: 60
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /hello
    port: 4000
  initialDelaySeconds: 30
  periodSeconds: 10

# Secrets (should be set via --set or values file)
secrets:
  jwtSecret: ""
  secretLoginCrypto: ""
  apiKey: ""
  buildApiKey: ""
  couponSecret: ""
  productSecret: ""

