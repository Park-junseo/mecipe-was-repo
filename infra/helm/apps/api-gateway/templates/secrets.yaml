apiVersion: v1
kind: Secret
metadata:
  name: {{ include "common.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.jwtPublicKey }}
  jwt-public-key: {{ .Values.secrets.jwtPublicKey | quote }}
  {{- end }}