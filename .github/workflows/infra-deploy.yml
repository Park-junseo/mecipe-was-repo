name: Deploy Infrastructure

on:
  push:
    branches: ["main"]
    paths:
      - 'infra/helm/**'
      - '.github/workflows/infra-deploy.yml'
    paths-ignore:
      - 'helm/cert-manager/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'latest'

    # 🚀 Deploy Infra (Instance A - app namespace) - Kafka 먼저 배포
    - name: Deploy Infra (Instance A - Kafka First)
      run: |
        echo "🚀 Deploying infrastructure to Instance A (app namespace) - Kafka first for Debezium dependency..."
        
        # Update Kafka chart dependencies
        cd ./infra/helm/kafka
        helm dependency update
        cd ../../..
        
        # Kafka (Bitnami chart with nodeSelector)
        helm upgrade --install kafka ./infra/helm/kafka \
          --namespace app \
          --create-namespace \
          --wait \
          --timeout 15m \
          --set kafka.enabled=true \
          --set kafka.nodeSelector.node-role=app
        
        # Wait for Kafka to be ready (Debezium이 의존하므로 필수)
        echo "⏳ Waiting for Kafka to be ready..."
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=kafka -n app --timeout=10m || echo "⚠️  Kafka may still be starting, but continuing..."

    # 🚀 Deploy Infra (Instance B - data namespace)
    - name: Deploy Infra (Instance B)
      run: |
        echo "🚀 Deploying infrastructure to Instance B (data namespace)..."
        
        # PostgreSQL - Helm values.yaml의 enabled로 제어
        # 외부 PostgreSQL 사용 시: --set enabled=false
        # 내부 배포 시: --set enabled=true (기본값)
        POSTGRES_ENABLED="${{ secrets.POSTGRES_DEPLOY || 'true' }}"
        if [ "$POSTGRES_ENABLED" = "false" ]; then
          echo "⏭️  PostgreSQL deployment disabled (external database)"
          POSTGRES_ENABLED_FLAG="false"
        else
          echo "📦 Deploying PostgreSQL in Kubernetes..."
          POSTGRES_ENABLED_FLAG="true"
        fi
        
        helm upgrade --install postgres ./infra/helm/postgres \
          --namespace data \
          --create-namespace \
          --wait \
          --timeout 10m \
          --set enabled=${POSTGRES_ENABLED_FLAG} \
          --set secrets.postgresPassword="${{ secrets.POSTGRES_PASSWORD }}" \
          --set auth.username="${{ secrets.POSTGRES_USER || 'postgres' }}" \
          --set auth.database="${{ secrets.POSTGRES_DB || 'mydb' }}"
        
        # PostgreSQL 연결 정보 관리 (항상 배포)
        # 외부면 POSTGRES_HOST 사용, 내부면 Kubernetes 서비스 이름
        if [ "$POSTGRES_ENABLED_FLAG" = "false" ]; then
          POSTGRES_CONNECTION_HOST="${{ secrets.POSTGRES_HOST || 'localhost' }}"
          POSTGRES_CONNECTION_PORT="${{ secrets.POSTGRES_PORT || '5432' }}"
          echo "🔗 Using external PostgreSQL: ${POSTGRES_CONNECTION_HOST}:${POSTGRES_CONNECTION_PORT}"
        else
          POSTGRES_CONNECTION_HOST="postgres.data.svc.cluster.local"
          POSTGRES_CONNECTION_PORT="5432"
          echo "🔗 Using Kubernetes PostgreSQL service: ${POSTGRES_CONNECTION_HOST}"
        fi
        
        helm upgrade --install postgres-connection ./infra/helm/postgres-connection \
          --namespace data \
          --create-namespace \
          --wait \
          --timeout 5m \
          --set connection.host="${POSTGRES_CONNECTION_HOST}" \
          --set connection.port="${POSTGRES_CONNECTION_PORT}" \
          --set connection.username="${{ secrets.POSTGRES_USER || 'postgres' }}" \
          --set connection.password="${{ secrets.POSTGRES_PASSWORD }}" \
          --set connection.database="${{ secrets.POSTGRES_DB || 'virtualcafe' }}" \
          --set connection.url="${{ secrets.DATABASE_URL }}" \
          --set service.enabled=${POSTGRES_ENABLED_FLAG}
        
        # Elasticsearch
        helm upgrade --install elasticsearch ./infra/helm/elasticsearch \
          --namespace data \
          --create-namespace \
          --wait \
          --timeout 10m \
          --set secrets.superuser.password="${{ secrets.ELASTICSEARCH_SUPERUSER_PASSWORD }}" \
          --set secrets.kibana.password="${{ secrets.ELASTICSEARCH_KIBANA_PASSWORD }}" \
          --set secrets.producerUser.password="${{ secrets.ELASTICSEARCH_PRODUCER_USER_PASS }}" \
          --set secrets.producerUser.username="${{ secrets.ELASTICSEARCH_PRODUCER_USER_NAME }}" \
          --set secrets.appUser.password="${{ secrets.ELASTICSEARCH_APP_USER_PASS }}" \
          --set secrets.appUser.username="${{ secrets.ELASTICSEARCH_APP_USER_NAME }}"
        
        # Debezium
        # PostgreSQL 호스트: 외부면 시크릿의 호스트, 내부면 Kubernetes 서비스
        if [ "$POSTGRES_ENABLED_FLAG" = "false" ]; then
          DEBEZIUM_POSTGRES_HOST="${POSTGRES_CONNECTION_HOST}"
          DEBEZIUM_POSTGRES_PORT="${POSTGRES_CONNECTION_PORT}"
        else
          DEBEZIUM_POSTGRES_HOST="postgres.data.svc.cluster.local"
          DEBEZIUM_POSTGRES_PORT="5432"
        fi
        
        # Kafka는 app namespace에 있으므로 FQDN 사용
        DEBEZIUM_KAFKA_BOOTSTRAP_SERVERS="kafka.app.svc.cluster.local:9092"
        echo "🔗 Debezium will connect to Kafka at: ${DEBEZIUM_KAFKA_BOOTSTRAP_SERVERS}"
        
        helm upgrade --install debezium ./infra/helm/debezium \
          --namespace data \
          --create-namespace \
          --wait \
          --timeout 10m \
          --set kafka.bootstrapServers="${DEBEZIUM_KAFKA_BOOTSTRAP_SERVERS}" \
          --set connector.database.hostname="${DEBEZIUM_POSTGRES_HOST}" \
          --set connector.database.port="${DEBEZIUM_POSTGRES_PORT}" \
          --set connector.database.user="${{ secrets.POSTGRES_USER || 'postgres' }}" \
          --set connector.database.password="${{ secrets.POSTGRES_PASSWORD }}" \
          --set connector.database.dbname="${{ secrets.POSTGRES_DB || 'mydb' }}"
        
        # Kibana
        helm upgrade --install kibana ./infra/helm/kibana \
          --namespace data \
          --create-namespace \
          --wait \
          --timeout 10m \
          --set secrets.kibanaPassword="${{ secrets.ELASTICSEARCH_KIBANA_PASSWORD }}"

    # ✅ Verify Instance B Pod Placement
    - name: Verify Instance B Pod Placement
      run: |
        echo "🔍 Verifying Pod placement in data namespace..."
        kubectl get pods -n data -o wide
        echo ""
        for pod in $(kubectl get pods -n data -o jsonpath='{.items[*].metadata.name}'); do
          NODE=$(kubectl get pod $pod -n data -o jsonpath='{.spec.nodeName}')
          NODE_LABEL=$(kubectl get node $NODE -o jsonpath='{.metadata.labels.node-role}' 2>/dev/null || echo "none")
          if [ "$NODE_LABEL" != "data" ]; then
            echo "⚠️  WARNING: Pod $pod is not on a data node!"
          else
            echo "✅ Pod $pod is correctly placed on data node"
          fi
        done

    # 🚀 Deploy Infra (Instance A - app namespace) - 나머지 인프라
    - name: Deploy Infra (Instance A - Remaining)
      run: |
        echo "🚀 Deploying remaining infrastructure to Instance A (app namespace)..."
        
        # Kafka UI
        helm upgrade --install kafka-ui ./infra/helm/kafka-ui \
          --namespace app \
          --create-namespace \
          --wait \
          --timeout 10m
        
        # KSQLDB
        helm upgrade --install ksqldb ./infra/helm/ksqldb \
          --namespace app \
          --create-namespace \
          --wait \
          --timeout 10m
        
        echo "🚀 Deploying ingress-nginx..."

        # Update ingress-nginx chart dependencies
        cd ./infra/helm/ingress-nginx
        helm dependency update
        cd ../../..

        helm upgrade --install ingress-nginx ./infra/helm/ingress-nginx \
          --namespace ingress-nginx \
          --create-namespace \
          --wait \
          --timeout 10m \
          -f ./infra/helm/ingress-nginx/values.yaml

    # ✅ Verify Instance A Pod Placement
    - name: Verify Instance A Pod Placement
      run: |
        echo "🔍 Verifying Pod placement in app namespace..."
        kubectl get pods -n app -o wide
        echo ""
        for pod in $(kubectl get pods -n app -o jsonpath='{.items[*].metadata.name}'); do
          NODE=$(kubectl get pod $pod -n app -o jsonpath='{.spec.nodeName}')
          NODE_LABEL=$(kubectl get node $NODE -o jsonpath='{.metadata.labels.node-role}' 2>/dev/null || echo "none")
          if [ "$NODE_LABEL" != "app" ]; then
            echo "⚠️  WARNING: Pod $pod is not on an app node!"
          else
            echo "✅ Pod $pod is correctly placed on app node"
          fi
        done

