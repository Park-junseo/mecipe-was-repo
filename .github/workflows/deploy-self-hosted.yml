name: Deploy with Self-Hosted Runner (Docker Compose)

on:
  push:
    branches: ["main"]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  # 🧪 1. 테스트 Job
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x
        cache: 'npm'
        cache-dependency-path: mecipe-was/package-lock.json

    - name: Install dependencies
      working-directory: ./mecipe-was
      run: npm ci

    - name: Generate Prisma Client
      working-directory: ./mecipe-was
      run: npx prisma generate

    - name: Run linter
      working-directory: ./mecipe-was
      run: npm run lint

    - name: Run tests
      working-directory: ./mecipe-was
      run: npm test

    - name: Build application
      working-directory: ./mecipe-was
      run: npm run build

  # 📦 2. Docker 이미지 빌드 및 푸시 (GitHub 서버에서 빌드 - 네트워크 빠름!)
  build_and_push_docker:
    needs: test
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push NestJS image
      uses: docker/build-push-action@v5
      with:
        context: ./mecipe-was
        file: ./mecipe-was/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/mecipe-api-server:latest
          ${{ secrets.DOCKER_USERNAME }}/mecipe-api-server:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mecipe-api-server:latest
        cache-to: type=inline

    - name: Build and push Nginx image
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        file: ./nginx/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/mecipe-nginx:latest
          ${{ secrets.DOCKER_USERNAME }}/mecipe-nginx:${{ github.sha }}

  # 🚀 3. Self-Hosted Runner에서 배포
  deploy:
    needs: [test, build_and_push_docker]
    runs-on: [self-hosted, Linux, X64]
    steps:
    - name: Cleanup workspace
      run: |
        echo "Cleaning up workspace..."
        sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
        
        # certbot 데이터는 Docker named volume에 저장되므로 유지됨
        # workspace만 정리
        sudo rm -rf $GITHUB_WORKSPACE/* || true
        sudo rm -rf $GITHUB_WORKSPACE/.* 2>/dev/null || true
    
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create .env file
      run: |
        echo "Creating .env file..."
        cat > .env << 'EOF'
        # Docker
        DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
        
        # Application
        NODE_ENV=production
        PORT=${{ secrets.PORT || 4000 }}
        SOCKET_PORT=${{ secrets.SOCKET_PORT || 4100 }}
        
        # Domain
        DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
        SSL_EMAIL=${{ secrets.SSL_EMAIL }}
        
        # Database
        DATABASE_URL=${{ secrets.DATABASE_URL }}
        
        # JWT
        JWT_SECRET=${{ secrets.JWT_SECRET }}

        # LOGIN CRYPTO
        SECRET_LOGIN_CRYPTO=${{ secrets.SECRET_LOGIN_CRYPTO }}

        # API Key (optional)
        API_KEY=${{ secrets.API_KEY }}
        BUILD_API_KEY=${{ secrets.BUILD_API_KEY }}

        # SECRET Key
        COUPON_SECRET=${{ secrets.COUPON_SECRET }}
        PRODUCT_SECRET=${{ secrets.PRODUCT_SECRET }}
        EOF
        chmod 600 .env

    - name: Pull latest images from Docker Hub
      run: |
        echo "Pulling latest Docker images from Docker Hub..."
        docker compose pull || echo "Pull failed, will build locally as fallback"

    - name: Setup SSL certificate (if needed)
      run: |
        echo "Checking SSL certificate status..."
        
        # Docker volume에서 직접 파일 확인
        SSL_EXISTS=$(docker run --rm -v mecipe-certbot-conf:/etc/letsencrypt alpine sh -c "test -f /etc/letsencrypt/live/${{ secrets.DOMAIN_NAME }}/fullchain.pem && echo 'true' || echo 'false'")
        
        if [ "$SSL_EXISTS" = "true" ]; then
          echo "✅ SSL certificate already exists"
          docker run --rm -v mecipe-certbot-conf:/etc/letsencrypt alpine ls -la /etc/letsencrypt/live/${{ secrets.DOMAIN_NAME }}/
        else
          echo "⚠️ SSL certificate not found - attempting to issue..."
          
          # DNS 확인
          echo "Checking DNS..."
          if nslookup ${{ secrets.DOMAIN_NAME }} | grep -q "Address"; then
            echo "✅ DNS is configured"
            
            # app과 nginx 시작 (HTTP만)
            docker compose up -d app nginx
            sleep 15
            
            # HTTP가 작동하는지 확인
            if curl -f http://localhost/health 2>/dev/null; then
              echo "✅ HTTP is working, attempting SSL certificate..."
              
              # Nginx 중지 (standalone 모드는 80 포트 필요)
              docker compose stop nginx
              
              # standalone 모드로 SSL 발급
              docker run --rm \
                -v mecipe-certbot-conf:/etc/letsencrypt \
                -v mecipe-certbot-www:/var/www/certbot \
                -p 80:80 \
                certbot/certbot certonly \
                --standalone \
                --email ${{ secrets.SSL_EMAIL }} \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                -d ${{ secrets.DOMAIN_NAME }}
              
              if [ $? -eq 0 ]; then
                echo "✅ SSL certificate issued successfully!"
                # Nginx 시작 (HTTPS 활성화)
                docker compose start nginx
                echo "✅ HTTPS enabled"
              else
                echo "⚠️ SSL issuance failed - starting nginx in HTTP-only mode"
                docker compose start nginx
              fi
            else
              echo "⚠️ HTTP not working - skipping SSL setup"
            fi
          else
            echo "⚠️ DNS not configured - skipping SSL setup"
            echo "💡 Configure DNS first, then re-run deployment"
          fi
        fi
    
    - name: Deploy with Docker Compose
      run: |
        echo "--- Starting deployment ---"
        
        # app과 nginx만 재시작 (certbot은 유지!)
        docker compose stop app nginx
        docker compose rm -f app nginx
        
        # Start new containers (use pulled images)
        echo "Starting containers..."
        docker compose up -d app nginx
        
        # certbot은 이미 실행 중이면 그대로, 없으면 시작
        docker compose up -d certbot
        
        # Wait for services to be healthy
        echo "Waiting for services to start..."
        sleep 30
        
        # Check service status
        docker compose ps
        
        echo "--- Deployment complete ---"

    - name: Run database migrations
      run: |
        echo "Running database migrations..."
        docker compose exec -T app npx prisma migrate deploy || echo "Migration failed or no migrations to apply"

    - name: Health check
      run: |
        echo "Performing health check..."
        
        # Wait a bit for the app to fully start
        sleep 10
        
        # Check if containers are running
        if docker compose ps | grep -q "Up"; then
          echo "✅ Services are running"
          
          # Try to reach the health endpoint
          if curl -f http://localhost/health 2>/dev/null; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health endpoint not responding yet"
          fi
        else
          echo "❌ Some services failed to start"
          docker compose logs --tail=50
          exit 1
        fi

    - name: Cleanup old images
      run: |
        echo "Cleaning up old Docker images..."
        docker image prune -f
    
    - name: Fix workspace permissions for next run
      if: always()
      run: |
        echo "Fixing workspace permissions..."
        sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true

