name: Deploy Minimal with Self-Hosted Runner (Docker Compose)

on:
  push:
    branches: ["main"]
    paths-ignore:
      - 'helm/**'
      - '.github/workflows/deploy-helm.yml'
      - '.github/workflows/ssl-renewal.yml'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  # 변경된 경로 확인
  detect_changes:
    runs-on: ubuntu-latest
    outputs:
      apps_changed: ${{ steps.filter.outputs.apps }}
      infra_changed: ${{ steps.filter.outputs.infra }}
      last_successful_sha: ${{ steps.last_success.outputs.sha }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # 전체 히스토리 필요 (base 비교를 위해)
      
      - name: Get last successful commit SHA
        id: last_success
        uses: actions/github-script@v6
        with:
          script: |
            try {
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: context.workflow,
                status: 'success',
                per_page: 1
              });
              
              if (runs.workflow_runs.length > 0) {
                const lastSuccessSha = runs.workflow_runs[0].head_sha;
                core.setOutput('sha', lastSuccessSha);
                core.info(`Last successful commit SHA: ${lastSuccessSha}`);
                return lastSuccessSha;
              } else {
                // 첫 배포인 경우 현재 커밋의 이전 커밋 사용
                core.setOutput('sha', context.sha);
                core.info(`No previous successful run found. Using current commit: ${context.sha}`);
                return context.sha;
              }
            } catch (error) {
              core.warning(`Failed to get last successful commit: ${error.message}`);
              // 실패 시 현재 커밋 사용 (안전한 폴백)
              core.setOutput('sha', context.sha);
              return context.sha;
            }
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          base: ${{ steps.last_success.outputs.sha }}
          filters: |
            apps:
              - 'apps/**'
            infra:
              - 'infra/**'
              - 'nginx/**'
              - 'docker-compose*.yml'
              - 'Dockerfile*'

  # 🧪 1. 테스트 Job
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20.x

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9.0.0

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Generate Prisma Client
      run: pnpm --filter place-api-service exec prisma generate

    - name: Run linter
      run: pnpm lint

    - name: Run tests
      run: pnpm test

    - name: Build applications
      run: pnpm build

  # 📦 2. Docker 이미지 빌드 및 푸시 (minimal 버전: place-indexer-service 제외)
  build_and_push_docker:
    needs: [test, detect_changes]
    runs-on: ubuntu-latest
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || 
       (github.event_name == 'push' && 
        github.ref == 'refs/heads/main' &&
        (needs.detect_changes.outputs.apps_changed == 'true' || needs.detect_changes.outputs.infra_changed == 'true')))
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push place-api-service image
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.apps_changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: apps/place-api-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/place-api-service:latest
          ${{ secrets.DOCKER_USERNAME }}/place-api-service:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/place-api-service:latest
        cache-to: type=inline

    - name: Build and push api-gateway image
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.apps_changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: apps/api-gateway/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
          ${{ secrets.DOCKER_USERNAME }}/api-gateway:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/api-gateway:latest
        cache-to: type=inline

    - name: Build and push meta-viewer-service image
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.apps_changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: .
        file: apps/meta-viewer-service/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/meta-viewer-service:latest
          ${{ secrets.DOCKER_USERNAME }}/meta-viewer-service:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/meta-viewer-service:latest
        cache-to: type=inline

    - name: Build and push Nginx image
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.infra_changed == 'true'
      uses: docker/build-push-action@v5
      with:
        context: ./nginx
        file: ./nginx/Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/mecipe-nginx:latest
          ${{ secrets.DOCKER_USERNAME }}/mecipe-nginx:${{ github.sha }}
        cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/mecipe-nginx:latest
        cache-to: type=inline

  # 🚀 3-1. 인스턴스 A 배포 (minimal 버전: Kafka 인프라 제외)
  deploy_instance_a:
    needs: [test, build_and_push_docker, detect_changes]
    runs-on: [self-hosted, Linux, X64, instance-a]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || 
       (needs.detect_changes.outputs.apps_changed == 'true' || needs.detect_changes.outputs.infra_changed == 'true'))
    steps:
    - name: Cleanup workspace
      run: |
        echo "Cleaning up workspace..."
        sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
        sudo rm -rf $GITHUB_WORKSPACE/* || true
        sudo rm -rf $GITHUB_WORKSPACE/.* 2>/dev/null || true
    
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create .env file for Instance A (minimal version)
      run: |
        echo "Creating .env file for Instance A (minimal version)..."
        cat > .env << 'EOF'
        # Docker
        DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
        IMAGE_TAG=${{ github.sha }}
        
        # Application
        NODE_ENV=production
        PORT=${{ vars.PORT || 4000 }}
        SOCKET_PORT=${{ vars.SOCKET_PORT || 4100 }}
        
        # Domain
        DOMAIN_NAME=${{ vars.DOMAIN_NAME }}
        SSL_EMAIL=${{ secrets.SSL_EMAIL }}
        
        # Database (Local PostgreSQL container)
        # minimal 버전에서는 로컬 PostgreSQL 컨테이너 사용
        POSTGRES_HOST=db-place
        POSTGRES_PORT=${{ secrets.POSTGRES_PORT || 5432 }}
        POSTGRES_USER=${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_DB=${{ vars.POSTGRES_DB }}
        # DATABASE_URL이 명시적으로 설정되지 않으면 로컬 PostgreSQL 사용
        DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@db-place:5432/${{ vars.POSTGRES_DB }}?schema=public
        
        # JWT
        JWT_SECRET=${{ secrets.JWT_SECRET }}
        JWT_PUBLIC_KEY=${{ secrets.JWT_PUBLIC_KEY }}

        # LOGIN CRYPTO
        SECRET_LOGIN_CRYPTO=${{ secrets.SECRET_LOGIN_CRYPTO }}

        # API Key (optional)
        API_KEY=${{ secrets.API_KEY }}
        BUILD_API_KEY=${{ secrets.BUILD_API_KEY }}

        # SECRET Key
        COUPON_SECRET=${{ secrets.COUPON_SECRET }}
        PRODUCT_SECRET=${{ secrets.PRODUCT_SECRET }}
        
        # Place API Service
        PLACE_API_SERVICE_URL=http://place-api-service:4000
        
        # Meta Viewer Service (Instance B - external access)
        # Set INSTANCE_B_IP in GitHub Secrets (e.g., 192.168.1.100)
        INSTANCE_B_IP=${{ vars.INSTANCE_B_IP || 'INSTANCE_B_IP' }}
        SOCKET_PORT=${{ vars.SOCKET_PORT || 4100 }}
        META_VIEWER_SERVICE_URL=${INSTANCE_B_IP}:${SOCKET_PORT}
        EOF
        chmod 600 .env

    - name: Pull latest images from Docker Hub
      run: |
        echo "Pulling latest Docker images from Docker Hub..."
        docker compose -f docker-compose.minimal.instance-a.yml pull || echo "Pull failed, will build locally as fallback"

    - name: Deploy PostgreSQL
      run: |
        echo "Checking PostgreSQL status..."
        
        # PostgreSQL 컨테이너 상태 확인
        POSTGRES_STATUS=$(docker compose -f docker-compose.minimal.instance-a.yml ps db-place 2>/dev/null | grep -E "Up|healthy|unhealthy" | head -1 || echo "not_running")
        
        if echo "$POSTGRES_STATUS" | grep -q "healthy"; then
          echo "✅ PostgreSQL is already running and healthy. Skipping deployment."
        else
          echo "PostgreSQL is not healthy or not running. Deploying/restarting..."
          
          # 기존 컨테이너가 있으면 중지 및 제거 (비밀번호 변경 등 설정 업데이트 반영)
          docker compose -f docker-compose.minimal.instance-a.yml stop db-place 2>/dev/null || true
          docker compose -f docker-compose.minimal.instance-a.yml rm -f db-place 2>/dev/null || true
          
          # PostgreSQL 컨테이너 시작
          docker compose -f docker-compose.minimal.instance-a.yml up -d db-place
          echo "Waiting for PostgreSQL to be healthy..."
          timeout 120 bash -c 'until docker compose -f docker-compose.minimal.instance-a.yml ps db-place | grep -q "healthy"; do sleep 2; done' || echo "PostgreSQL health check timeout, continuing..."
          sleep 5
        fi
        
        # PostgreSQL wal_level 확인 (Debezium용)
        echo "Checking PostgreSQL configuration (wal_level=logical for Debezium)..."
        docker compose -f docker-compose.minimal.instance-a.yml exec -T db-place psql -U ${{ secrets.POSTGRES_USER }} -d ${{ secrets.POSTGRES_DB }} -c "SHOW wal_level;" 2>/dev/null || echo "PostgreSQL configuration check failed, continuing..."

    - name: Deploy applications
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.apps_changed == 'true'
      run: |
        echo "Deploying applications..."
        docker compose -f docker-compose.minimal.instance-a.yml up -d place-api-service api-gateway
        echo "Waiting for applications to be healthy..."
        sleep 30

    - name: Setup SSL certificate (if needed)
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.infra_changed == 'true'
      run: |
        echo "Checking SSL certificate status..."
        
        SSL_EXISTS=$(docker run --rm -v mecipe-certbot-conf:/etc/letsencrypt alpine sh -c "test -f /etc/letsencrypt/live/${{ secrets.DOMAIN_NAME }}/fullchain.pem && echo 'true' || echo 'false'" 2>/dev/null || echo "false")
        
        if [ "$SSL_EXISTS" = "true" ]; then
          echo "✅ SSL certificate already exists"
        else
          echo "⚠️ SSL certificate not found - attempting to issue..."
          
          if nslookup ${{ secrets.DOMAIN_NAME }} | grep -q "Address"; then
            echo "✅ DNS is configured"
            
            # Start nginx with HTTP only first
            docker compose -f docker-compose.minimal.instance-a.yml up -d nginx
            sleep 15
            
            if curl -f http://localhost/health 2>/dev/null; then
              echo "✅ HTTP is working, attempting SSL certificate..."
              
              docker compose -f docker-compose.minimal.instance-a.yml stop nginx
              
              docker run --rm \
                -v mecipe-certbot-conf:/etc/letsencrypt \
                -v mecipe-certbot-www:/var/www/certbot \
                -p 80:80 \
                certbot/certbot certonly \
                --standalone \
                --email ${{ secrets.SSL_EMAIL }} \
                --agree-tos \
                --no-eff-email \
                --non-interactive \
                -d ${{ secrets.DOMAIN_NAME }}
              
              if [ $? -eq 0 ]; then
                echo "✅ SSL certificate issued successfully!"
                docker compose -f docker-compose.minimal.instance-a.yml start nginx
              else
                echo "⚠️ SSL issuance failed - starting nginx in HTTP-only mode"
                docker compose -f docker-compose.minimal.instance-a.yml start nginx
              fi
            else
              echo "⚠️ HTTP not working - skipping SSL setup"
              docker compose -f docker-compose.minimal.instance-a.yml up -d nginx
            fi
          else
            echo "⚠️ DNS not configured - skipping SSL setup"
            docker compose -f docker-compose.minimal.instance-a.yml up -d nginx
          fi
        fi
        
        # Start certbot
        docker compose -f docker-compose.minimal.instance-a.yml up -d certbot

    - name: Run database migrations
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.apps_changed == 'true'
      run: |
        echo "Running database migrations..."
        docker compose -f docker-compose.minimal.instance-a.yml exec -T place-api-service sh -c "cd /app/apps/place-api-service && prisma migrate deploy --schema=./prisma/schema.prisma" || echo "Migration failed or no migrations to apply"

    - name: Health check
      run: |
        echo "Performing health check..."
        sleep 20
        
        if docker compose -f docker-compose.minimal.instance-a.yml ps | grep -q "Up"; then
          echo "✅ Services are running"
          
          # PostgreSQL 헬스 체크
          if docker compose -f docker-compose.minimal.instance-a.yml exec -T db-place pg_isready -U ${{ secrets.POSTGRES_USER }} 2>/dev/null | grep -q "accepting connections"; then
            echo "✅ PostgreSQL health check passed"
          else
            echo "⚠️ PostgreSQL not responding yet"
          fi
          
          if curl -f http://localhost/health 2>/dev/null; then
            echo "✅ Health check passed"
          else
            echo "⚠️ Health endpoint not responding yet"
          fi
        else
          echo "❌ Some services failed to start"
          docker compose -f docker-compose.minimal.instance-a.yml logs --tail=50
          exit 1
        fi

    - name: Cleanup old images
      run: |
        echo "Cleaning up old Docker images..."
        docker image prune -f
    
    - name: Fix workspace permissions
      if: always()
      run: |
        echo "Fixing workspace permissions..."
        sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true

  # 🚀 3-2. 인스턴스 B 배포 (minimal 버전: Elasticsearch, Kibana, Debezium, place-indexer-service 제외)
  deploy_instance_b:
    needs: [test, build_and_push_docker, detect_changes, deploy_instance_a]
    runs-on: [self-hosted, Linux, X64, instance-b]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || 
       (needs.detect_changes.outputs.apps_changed == 'true' || needs.detect_changes.outputs.infra_changed == 'true')) &&
      (needs.deploy_instance_a.result == 'success' || needs.deploy_instance_a.result == 'skipped')
    steps:
    - name: Cleanup workspace
      run: |
        echo "Cleaning up workspace..."
        sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
        sudo rm -rf $GITHUB_WORKSPACE/* || true
        sudo rm -rf $GITHUB_WORKSPACE/.* 2>/dev/null || true
    
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Create .env file for Instance B (minimal version)
      run: |
        echo "Creating .env file for Instance B (minimal version)..."
        cat > .env << 'EOF'
        # Docker
        DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
        IMAGE_TAG=${{ github.sha }}
        
        # Application
        NODE_ENV=production
        PORT=${{ vars.PORT || 4000 }}
        SOCKET_PORT=${{ vars.SOCKET_PORT || 4100 }}
        
        # JWT
        JWT_SECRET=${{ secrets.JWT_SECRET }}

        # Redis
        REDIS_URL=${REDIS_URL:-redis://redis:6379}
        REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
        EOF
        chmod 600 .env

    - name: Pull latest images from Docker Hub
      run: |
        echo "Pulling latest Docker images from Docker Hub..."
        docker compose -f docker-compose.minimal.instance-b.yml pull || echo "Pull failed, will build locally as fallback"

    - name: Deploy Redis
      run: |
        echo "Checking Redis status..."
        
        # Redis 컨테이너 상태 확인
        REDIS_STATUS=$(docker compose -f docker-compose.minimal.instance-b.yml ps redis 2>/dev/null | grep -E "Up|healthy|unhealthy" | head -1 || echo "not_running")
        
        if echo "$REDIS_STATUS" | grep -q "healthy"; then
          echo "✅ Redis is already running and healthy. Skipping deployment."
        else
          echo "Redis is not healthy or not running. Deploying/restarting..."
          
          # 기존 컨테이너가 있으면 중지 및 제거
          docker compose -f docker-compose.minimal.instance-b.yml stop redis 2>/dev/null || true
          docker compose -f docker-compose.minimal.instance-b.yml rm -f redis 2>/dev/null || true
          
          # Redis 컨테이너 시작
          docker compose -f docker-compose.minimal.instance-b.yml up -d redis
          echo "Waiting for Redis to be healthy..."
          timeout 120 bash -c 'until docker compose -f docker-compose.minimal.instance-b.yml ps redis | grep -q "healthy"; do sleep 2; done' || echo "Redis health check timeout, continuing..."
          sleep 5
        fi

    - name: Deploy applications
      if: github.event_name == 'workflow_dispatch' || needs.detect_changes.outputs.apps_changed == 'true'
      run: |
        echo "Deploying applications..."
        docker compose -f docker-compose.minimal.instance-b.yml up -d meta-viewer-service
        echo "Waiting for applications to start..."
        sleep 30

    - name: Health check
      run: |
        echo "Performing health check..."
        sleep 20
        
        if docker compose -f docker-compose.minimal.instance-b.yml ps | grep -q "Up"; then
          echo "✅ Services are running"
          
          # Redis 헬스 체크
          if docker compose -f docker-compose.minimal.instance-b.yml ps redis | grep -q "healthy"; then
            echo "✅ Redis container is healthy"
            
            # Redis 연결 테스트 (비밀번호가 있는 경우 처리)
            if [ -n "${{ secrets.REDIS_PASSWORD }}" ]; then
              if docker compose -f docker-compose.minimal.instance-b.yml exec -T redis redis-cli -a "${{ secrets.REDIS_PASSWORD }}" ping 2>/dev/null | grep -q "PONG"; then
                echo "✅ Redis connection test passed (with password)"
              else
                echo "⚠️ Redis connection test failed (with password)"
              fi
            else
              if docker compose -f docker-compose.minimal.instance-b.yml exec -T redis redis-cli ping 2>/dev/null | grep -q "PONG"; then
                echo "✅ Redis connection test passed (no password)"
              else
                echo "⚠️ Redis connection test failed (no password)"
              fi
            fi
          else
            echo "⚠️ Redis container is not healthy"
            docker compose -f docker-compose.minimal.instance-b.yml ps redis
            docker compose -f docker-compose.minimal.instance-b.yml logs redis --tail=20
          fi
          
          # Meta Viewer Service 헬스 체크
          if docker compose -f docker-compose.minimal.instance-b.yml ps meta-viewer-service | grep -q "healthy"; then
            echo "✅ Meta Viewer Service is healthy"
          else
            echo "⚠️ Meta Viewer Service is not healthy"
            docker compose -f docker-compose.minimal.instance-b.yml logs meta-viewer-service --tail=20
          fi
        else
          echo "❌ Some services failed to start"
          docker compose -f docker-compose.minimal.instance-b.yml logs --tail=50
          exit 1
        fi

    - name: Cleanup old images
      run: |
        echo "Cleaning up old Docker images..."
        docker image prune -f
    
    - name: Fix workspace permissions
      if: always()
      run: |
        echo "Fixing workspace permissions..."
        sudo chown -R $USER:$USER $GITHUB_WORKSPACE || true
