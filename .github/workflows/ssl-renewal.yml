name: SSL Certificate Renewal Check

# SSL 인증서 갱신 확인 워크플로우
# Let's Encrypt 인증서는 90일마다 갱신이 필요하며,
# Certbot은 자동으로 갱신하지만, 이 워크플로우로 상태를 확인할 수 있습니다.

on:
  # 매주 월요일 오전 9시(UTC)에 실행
  schedule:
    - cron: '0 9 * * 1'
  
  # 수동 실행 가능
  workflow_dispatch:

jobs:
  check-ssl:
    name: Check SSL Certificate Status
    runs-on: [self-hosted, Linux, X64, instance-a]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Check SSL certificate expiry
        run: |
          echo "Checking SSL certificate expiry..."
          # certbot 서비스만 독립적으로 실행 (환경 변수 경고 무시)
          docker run --rm \
            -v mecipe-certbot-conf:/etc/letsencrypt \
            -v mecipe-certbot-www:/var/www/certbot \
            certbot/certbot certificates
      
      - name: Ensure nginx is running
        run: |
          echo "Ensuring nginx is running for webroot mode..."
          # nginx가 이미 실행 중인지 확인
          if docker compose -f docker-compose.minimal.instance-a.yml ps nginx | grep -q "Up"; then
            echo "✅ Nginx is already running"
          else
            echo "⚠️ Nginx is not running. Starting nginx (without building)..."
            # --no-build 플래그로 빌드 없이 시작 (이미지가 이미 존재해야 함)
            docker compose -f docker-compose.minimal.instance-a.yml up -d --no-build nginx 2>/dev/null || \
            docker compose -f docker-compose.minimal.instance-a.yml up -d nginx || {
              echo "❌ Failed to start nginx. Please ensure nginx image exists."
              echo "💡 Tip: Run the deployment workflow first to build and deploy images."
              exit 1
            }
            sleep 3
          fi
          
          # nginx가 정상적으로 응답하는지 확인
          if curl -f http://localhost/health 2>/dev/null; then
            echo "✅ Nginx is running and responding"
          else
            echo "⚠️ Nginx might not be ready yet, but continuing..."
          fi
      
      - name: Test certificate renewal (dry-run) with webroot mode
        run: |
          echo "Testing certificate renewal using webroot mode (nginx stays running)..."
          # webroot 모드 사용: nginx가 실행 중일 때도 작동
          # nginx가 /.well-known/acme-challenge/ 경로를 /var/www/certbot으로 서빙하므로
          # certbot이 파일을 쓰면 nginx가 자동으로 제공함
          docker run --rm \
            -v mecipe-certbot-conf:/etc/letsencrypt \
            -v mecipe-certbot-www:/var/www/certbot \
            certbot/certbot renew \
            --webroot \
            --webroot-path /var/www/certbot \
            --dry-run
          
          # 결과 출력
          RENEWAL_EXIT_CODE=$?
          if [ $RENEWAL_EXIT_CODE -eq 0 ]; then
            echo "✅ SSL certificate is valid and renewal test passed"
          else
            echo "❌ SSL certificate renewal test failed (exit code: $RENEWAL_EXIT_CODE)"
            echo "⚠️ This might be normal if the certificate is not close to expiry"
            # dry-run 실패는 경고로만 처리 (실제 갱신이 필요할 때는 성공할 수 있음)
          fi

      - name: Notify on failure
        if: failure()
        run: |
          echo "SSL certificate check or renewal test failed!"
          echo "Please check the server manually."
          # 여기에 Slack, Discord, 이메일 알림 등을 추가할 수 있습니다.

