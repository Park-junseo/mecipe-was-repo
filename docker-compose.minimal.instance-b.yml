services:
  # Meta Viewer Service
  meta-viewer-service:
    image: ${DOCKER_USERNAME:-local}/meta-viewer-service:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/meta-viewer-service/Dockerfile
    container_name: meta-viewer-service
    restart: unless-stopped
    ports:
      - "${SOCKET_PORT:-4100}:${SOCKET_PORT:-4100}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${SOCKET_PORT:-4100}
      - SOCKET_PORT=${SOCKET_PORT:-4100}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET}
    networks:
      - instance-b-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:${SOCKET_PORT:-4100}/hello', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
      
  # Redis
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: >
      sh -c "
        if [ -n \"$${REDIS_PASSWORD}\" ]; then
          redis-server --requirepass $${REDIS_PASSWORD}
        else
          redis-server
        fi
      "
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - instance-b-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  instance-b-network:
    driver: bridge

volumes:
  elasticsearch-data:
  kibana-data:
  redis-data:

