{{- if .Values.ksqldb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mecipe-instance-pre-a.fullname" . }}-ksqldb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecipe-instance-pre-a.labels" . | nindent 4 }}
    app.kubernetes.io/component: ksqldb
spec:
  type: ClusterIP
  ports:
    - port: 8088
      targetPort: 8088
      protocol: TCP
      name: http
  selector:
    {{- include "mecipe-instance-pre-a.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ksqldb
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecipe-instance-pre-a.fullname" . }}-ksqldb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecipe-instance-pre-a.labels" . | nindent 4 }}
    app.kubernetes.io/component: ksqldb
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "mecipe-instance-pre-a.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ksqldb
  template:
    metadata:
      labels:
        {{- include "mecipe-instance-pre-a.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ksqldb
    spec:
      containers:
      - name: ksqldb-server
        image: {{ include "mecipe-instance-pre-a.image" (dict "Values" .Values "repository" .Values.ksqldb.image.repository "tag" .Values.ksqldb.image.tag) }}
        imagePullPolicy: {{ .Values.ksqldb.image.pullPolicy | default "IfNotPresent" }}
        ports:
        - name: http
          containerPort: 8088
          protocol: TCP
        env:
        - name: KSQL_BOOTSTRAP_SERVERS
          value: {{ .Values.ksqldb.kafka.brokers | quote }}
        - name: KSQL_LISTENERS
          value: "http://0.0.0.0:8088"
        - name: KSQL_KSQL_SERVICE_ID
          value: "mecipe-ksqldb-service"
        - name: KSQL_KSQL_STREAMS_AUTO_OFFSET_RESET
          value: {{ .Values.ksqldb.streamsAutoOffsetReset | quote }}
        - name: KSQL_KSQL_LOGGING_PROCESSING_STREAM_AUTO_CREATE
          value: "true"
        - name: KSQL_KSQL_LOGGING_PROCESSING_TOPIC_AUTO_CREATE
          value: "true"
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /info
            port: 8088
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /info
            port: 8088
          initialDelaySeconds: 30
          periodSeconds: 10
{{- end }}


