{{- if .Values.placeIndexerService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mecipe-instance-a.fullname" . }}-place-indexer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecipe-instance-a.labels" . | nindent 4 }}
spec:
  type: {{ .Values.placeIndexerService.service.type }}
  ports:
    - port: {{ .Values.placeIndexerService.service.port }}
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    {{- include "mecipe-instance-a.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: place-indexer-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecipe-instance-a.fullname" . }}-place-indexer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecipe-instance-a.labels" . | nindent 4 }}
    app.kubernetes.io/component: place-indexer-service
spec:
  replicas: {{ .Values.placeIndexerService.replicaCount }}
  selector:
    matchLabels:
      {{- include "mecipe-instance-a.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: place-indexer-service
  template:
    metadata:
      labels:
        {{- include "mecipe-instance-a.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: place-indexer-service
    spec:
      {{- if and .Values.global.imagePullSecrets (gt (len .Values.global.imagePullSecrets) 0) }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: place-indexer-service
        image: {{ include "mecipe-instance-a.image" (dict "Values" .Values "repository" .Values.placeIndexerService.image.repository "tag" .Values.placeIndexerService.image.tag) }}
        imagePullPolicy: {{ .Values.placeIndexerService.image.pullPolicy | default "Always" }}
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.placeIndexerService.env.nodeEnv | quote }}
        - name: ELASTICSEARCH_HOSTS
          value: {{ .Values.placeIndexerService.env.elasticsearchHosts | quote }}
        {{- if .Values.secrets.elasticsearchUsername }}
        - name: ELASTICSEARCH_USERNAME
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: elasticsearch-username
        {{- end }}
        {{- if .Values.secrets.elasticsearchPassword }}
        - name: ELASTICSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: elasticsearch-password
        {{- end }}
        - name: KAFKA_BROKERS
          value: {{ .Values.placeIndexerService.env.kafkaBrokers | quote }}
        {{- with .Values.placeIndexerService.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.placeIndexerService.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.placeIndexerService.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
{{- end }}

