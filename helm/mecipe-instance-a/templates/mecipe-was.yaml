{{- if .Values.mecipeWAS.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mecipe-instance-a.fullname" . }}-was
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecipe-instance-a.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mecipeWAS.service.type }}
  ports:
    - port: {{ .Values.mecipeWAS.service.ports.http }}
      targetPort: 4000
      protocol: TCP
      name: http
    - port: {{ .Values.mecipeWAS.service.ports.socket }}
      targetPort: 4100
      protocol: TCP
      name: socket
  selector:
    {{- include "mecipe-instance-a.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mecipe-was
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mecipe-instance-a.fullname" . }}-was
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mecipe-instance-a.labels" . | nindent 4 }}
    app.kubernetes.io/component: mecipe-was
spec:
  replicas: {{ .Values.mecipeWAS.replicaCount }}
  selector:
    matchLabels:
      {{- include "mecipe-instance-a.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mecipe-was
  template:
    metadata:
      labels:
        {{- include "mecipe-instance-a.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mecipe-was
    spec:
      {{- if and .Values.global.imagePullSecrets (gt (len .Values.global.imagePullSecrets) 0) }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      containers:
      - name: mecipe-was
        image: {{ include "mecipe-instance-a.image" (dict "Values" .Values "repository" .Values.mecipeWAS.image.repository "tag" .Values.mecipeWAS.image.tag) }}
        imagePullPolicy: {{ .Values.mecipeWAS.image.pullPolicy | default "Always" }}
        ports:
        - name: http
          containerPort: 4000
          protocol: TCP
        - name: socket
          containerPort: 4100
          protocol: TCP
        env:
        - name: NODE_ENV
          value: {{ .Values.mecipeWAS.env.nodeEnv | quote }}
        - name: PORT
          value: {{ .Values.mecipeWAS.env.port | quote }}
        - name: SOCKET_PORT
          value: {{ .Values.mecipeWAS.env.socketPort | quote }}
        {{- if .Values.secrets.databaseUrl }}
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: database-url
        {{- end }}
        {{- if .Values.secrets.jwtSecret }}
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: jwt-secret
        {{- end }}
        {{- if .Values.secrets.secretLoginCrypto }}
        - name: SECRET_LOGIN_CRYPTO
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: secret-login-crypto
        {{- end }}
        {{- if .Values.secrets.apiKey }}
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: api-key
              optional: true
        {{- end }}
        {{- if .Values.secrets.buildApiKey }}
        - name: BUILD_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: build-api-key
              optional: true
        {{- end }}
        {{- if .Values.secrets.couponSecret }}
        - name: COUPON_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: coupon-secret
        {{- end }}
        {{- if .Values.secrets.productSecret }}
        - name: PRODUCT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "mecipe-instance-a.fullname" . }}-secrets
              key: product-secret
        {{- end }}
        {{- if .Values.mecipeWAS.persistence.enabled }}
        volumeMounts:
        - name: media-storage
          mountPath: /app/media
        {{- end }}
        {{- with .Values.mecipeWAS.resources }}
        resources:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.mecipeWAS.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.mecipeWAS.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- if .Values.mecipeWAS.persistence.enabled }}
      volumes:
      - name: media-storage
        persistentVolumeClaim:
          claimName: {{ include "mecipe-instance-a.fullname" . }}-media-pvc
      {{- end }}
{{- end }}

