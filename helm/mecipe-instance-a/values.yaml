# Default values for mecipe-instance-a
# This is a YAML-formatted file.

global:
  dockerRegistry: ""
  imagePullSecrets: []

# Place Indexer Service Configuration
placeIndexerService:
  enabled: true
  image:
    repository: ""
    tag: "latest"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3000
  env:
    nodeEnv: production
    elasticsearchHosts: "http://elasticsearch.instance-b.svc.cluster.local:9200"
    elasticsearchUsername: ""
    elasticsearchPassword: ""
    kafkaBrokers: "kafka.instance-pre-a.svc.cluster.local:9092"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10

# Mecipe WAS Configuration
mecipeWAS:
  enabled: true
  image:
    repository: ""
    tag: "latest"
  replicaCount: 1
  service:
    type: ClusterIP
    ports:
      http: 4000
      socket: 4100
  env:
    nodeEnv: production
    port: "4000"
    socketPort: "4100"
    databaseUrl: ""
    jwtSecret: ""
    secretLoginCrypto: ""
    apiKey: ""
    buildApiKey: ""
    couponSecret: ""
    productSecret: ""
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /hello
      port: 4000
    initialDelaySeconds: 60
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /hello
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 10

# Nginx Configuration
nginx:
  enabled: true
  image:
    repository: ""
    tag: "latest"
  replicaCount: 1
  service:
    type: LoadBalancer
    ports:
      http: 80
      https: 443
  env:
    domainName: ""
    appPort: "4000"
    socketPort: "4100"
  persistence:
    certbotConf:
      enabled: true
      size: 1Gi
    certbotWww:
      enabled: true
      size: 1Gi
    media:
      enabled: true
      size: 10Gi

# Certbot Configuration
certbot:
  enabled: true
  schedule: "0 0,12 * * *"  # 매일 자정과 정오
  persistence:
    certbotConf:
      enabled: true
    certbotWww:
      enabled: true

# ConfigMap for application configuration
configMap:
  domainName: ""
  elasticsearchHosts: "http://elasticsearch.instance-b.svc.cluster.local:9200"

# Secrets (should be managed externally or via sealed-secrets)
secrets:
  # These should be set via --set or values file, not committed to git
  databaseUrl: ""
  jwtSecret: ""
  secretLoginCrypto: ""
  elasticsearchUsername: ""
  elasticsearchPassword: ""
  apiKey: ""
  buildApiKey: ""
  couponSecret: ""
  productSecret: ""

